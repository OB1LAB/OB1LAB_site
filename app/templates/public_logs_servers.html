{% if request.method == "GET" %}
    {% extends "base.html" %}

    {% block content %}
        <hr>
        <div class="public_logs_servers">
            <div class="select_server_menu">
                <div class="server_list">
                    <h1>Выберите сервер:</h1>
                    <div class="servers">
                        {% for server in servers %}
                            <a href="{{ route_data.url_path }}/public_logs/{{ server }}"><img src="{{ url_for('static', filename='css/images/'+server+'.png') }}"></a>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    {% endblock %}
{% else %}
    <div class="title">{{ title }}</div>
    <hr>
    <div class="public_logs_servers">
        <div class="select_server_menu">
            <div class="server_list">
                <h1>Выберите сервер:</h1>
                <div class="servers">
                    {% for server in servers %}
                        <a href="{{ route_data.url_path }}/public_logs/{{ server }}"><img src="{{ url_for('static', filename='css/images/'+server+'.png') }}"></a>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
{% endif %}
