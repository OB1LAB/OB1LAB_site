{% if request.method == "GET" %}
    {% extends "base.html" %}
    {% block content %}
        <div class="public_logs_dates">
            <h1>UltimaTech/Приватные логи</h1>
            <hr>
            <div class="log_dates">
                <div class="log_date"><a href="{{ route_data.url_path }}">Назад</a></div>
                {% for date in dates %}
                    <div class="log_date"><a href="{{ route_data.url_path }}/private_logs/{{ date }}">{{ date }}</a></div>
                {% endfor %}
            </div>
            <hr>
        </div>
    {% endblock %}
{% else %}
    <div class="public_logs_dates">
        <h1>UltimaTech/Приватные логи</h1>
        <hr>
        <div class="log_dates">
            <div class="log_date"><a href="{{ route_data.url_path }}">Назад</a></div>
            {% for date in dates %}
                <div class="log_date"><a href="{{ route_data.url_path }}/private_logs/{{ date }}">{{ date }}</a></div>
            {% endfor %}
        </div>
        <hr>
    </div>
{% endif %}
